# CI quality gate for InsureFlow.
#   - secret-scan       GitGuardian — bypass-proof, runs even if a local hook is skipped
#   - lint              ruff + mypy (strict) + bandit
#   - fitness-functions pytest architectural property checks (tests/contracts)
# Later phases add unit-tests and data-quality (dbt test / soda scan) jobs as that
# code lands. See procedures/code-quality.md.
#
# Action refs are pinned to commit SHAs (supply-chain hardening); the trailing
# `# vX.Y.Z` comment keeps them human-readable and easy to bump.
name: quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (GitGuardian)
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - name: Checkout (full history for a complete scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: ggshield secret scan
        if: ${{ env.GITGUARDIAN_API_KEY != '' }}
        run: |
          pip install --quiet ggshield
          ggshield secret scan ci

      - name: Secret not configured — skipping (non-blocking)
        if: ${{ env.GITGUARDIAN_API_KEY == '' }}
        run: |
          echo "::warning title=GitGuardian CI scan skipped::GITGUARDIAN_API_KEY secret is not set."
          echo "Activate it with:  gh secret set GITGUARDIAN_API_KEY --repo tarigelamin1997/insureflow"

  lint:
    name: Lint (ruff · mypy · bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install tools
        # Versions pinned to match .pre-commit-config.yaml — CI and the local gate must not drift.
        # pytest is needed for mypy to resolve `import pytest` in the contract tests.
        # psycopg (ships py.typed) is needed for mypy to resolve `import psycopg` in the Phase 02
        # contract tests; the binary extra avoids a libpq/compiler build on the runner.
        run: pip install --quiet ruff==0.6.9 mypy==1.11.2 bandit==1.7.10 types-PyYAML pytest==7.4.3 "psycopg[binary]==3.2.3"

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format check)
        run: ruff format --check .

      - name: mypy (strict)
        # One mypy process per source tree, never combined: the phase dir name
        # `02-source-systems` is not a legal Python package path, and every contracts suite
        # ships its own `conftest.py` — a single mypy process over two same-named modules
        # fails with "Duplicate module named conftest". So check the seed package + its unit
        # tests together (MYPYPATH puts the phase dir on the path so `import seed.*` resolves
        # the way the runtime conftest does), then each contracts suite in its own invocation.
        # `01-infrastructure/tests/contracts` has no conftest today, but keeping it isolated
        # means adding one later cannot reintroduce the duplicate-module collision.
        run: |
          MYPYPATH=02-source-systems mypy --strict 02-source-systems/seed 02-source-systems/tests/unit
          mypy --strict 01-infrastructure/tests/contracts
          mypy --strict 02-source-systems/tests/contracts

      - name: bandit (medium+ severity)
        run: bandit -ll -r .

  fitness-functions:
    name: Fitness functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install test deps
        # Pinned for deterministic contract-test runs, consistent with the rest of the toolchain.
        # psycopg[binary] lets the Phase 02 contract tests IMPORT cleanly; they still SKIP here
        # because this job has no Postgres — the behavioral proof runs against the live stack at
        # phase close. (A skip is reported, never a false pass.)
        run: pip install --quiet pytest==7.4.3 pyyaml==6.0.3 "psycopg[binary]==3.2.3"

      - name: pytest (contracts)
        # -ra surfaces the skip reasons in the summary so a reader sees WHY Phase 02 skipped
        # (no DB) rather than a silent green. rootdir per phase keeps conftest discovery correct.
        run: pytest 01-infrastructure/tests/contracts 02-source-systems/tests/contracts -v -ra --tb=short
