# Python tooling baseline for InsureFlow. Activated in Phase 01 (the first Python in the
# repo is the fitness functions). Every later phase's Python inherits this config.
# See procedures/code-quality.md.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# All rules on, minus a small set that conflict with the formatter or with each other.
select = ["ALL"]
ignore = [
  "D203",   # one-blank-line-before-class — conflicts with D211
  "D213",   # multi-line-summary-second-line — conflicts with D212
  "COM812", # trailing comma — handled by the formatter
  "ISC001", # single-line implicit string concat — handled by the formatter
  "ANN401", # allow `Any` for parsed-YAML values where a precise type adds no safety
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101 is the point) and are not an importable package (no __init__).
"**/tests/**" = ["S101", "INP001"]

[tool.mypy]
python_version = "3.11"
strict = true
