# CI quality gate for InsureFlow.
# Now (blueprint stage): GitGuardian secret scan on every push and PR — the
# bypass-proof layer that runs even if a local pre-commit hook is skipped.
# Phase 01 expands this workflow with lint (ruff / mypy / bandit), unit tests,
# data-quality (dbt test / soda scan), and fitness-function jobs once Python
# code lands. See procedures/code-quality.md.
name: quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (GitGuardian)
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - name: Checkout (full history for a complete scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ggshield secret scan
        if: ${{ env.GITGUARDIAN_API_KEY != '' }}
        run: |
          pip install --quiet ggshield
          ggshield secret scan ci

      - name: Secret not configured — skipping (non-blocking)
        if: ${{ env.GITGUARDIAN_API_KEY == '' }}
        run: |
          echo "::warning title=GitGuardian CI scan skipped::GITGUARDIAN_API_KEY secret is not set."
          echo "Activate it with:  gh secret set GITGUARDIAN_API_KEY --repo tarigelamin1997/insureflow"
